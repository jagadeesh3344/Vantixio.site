<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="vGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#146eff"/>
    </linearGradient>
    <linearGradient id="vGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0a2540"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#020712"/>
  <g filter="url(#glow)">
    <!-- Left Wing of V -->
    <path d="M22 25 L40 25 L50 68 L36 68 Z" fill="url(#vGrad1)"/>
    <!-- Right Wing of V -->
    <path d="M78 25 L60 25 L50 68 L64 68 Z" fill="url(#vGrad2)"/>
    <!-- Center Apex Facet -->
    <polygon points="50,68 43,50 57,50" fill="#5eead4" opacity="0.9"/>
  </g>
</svg>

